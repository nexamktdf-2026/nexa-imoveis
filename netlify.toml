[build]
  command = "node build.mjs"
  publish = "dist"
[build.environment]
  NODE_VERSION = "20"
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
